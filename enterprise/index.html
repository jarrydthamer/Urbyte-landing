<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URBYTE // INSIGHT: PARTNER INTELLIGENCE</title>
    <style>
        :root {
            --bg-main: #050508;
            --bg-card: #0C0D12;
            --bg-input: #020203;
            --border-muted: #161A24;
            --border-active: #2A3247;
            
            /* Dynamic Brand Colors updated via JS */
            --primary: #4AE54A;
            --primary-glow: rgba(74, 229, 74, 0.1);
            --text-main: #FFFFFF;
            --text-muted: #626D85;
            --warning: #FF4A4A;
        }

        * {
            box-sizing: border-box;
            border-radius: 0px !important; /* Forces completely sharp edges across all elements */
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            letter-spacing: -0.2px;
            -webkit-font-smoothing: antialiased;
        }

        .mono {
            font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        }

        /* --- AUTH WALL PANEL --- */
        #auth-wall {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            border: 4px solid var(--border-muted);
        }
        .auth-container {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            border: 1px solid var(--border-active);
            padding: 40px;
            text-align: center;
        }
        .terminal-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-active);
            color: var(--text-main);
            padding: 14px;
            font-family: monospace;
            font-size: 16px;
            text-align: center;
            margin-bottom: 16px;
            outline: none;
        }
        .terminal-input:focus {
            border-color: var(--primary);
        }
        .btn-terminal {
            width: 100%;
            background: var(--primary);
            color: #000000;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 14px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-terminal:hover {
            opacity: 0.9;
        }

        /* --- DASHBOARD LAYOUT --- */
        #dashboard-layout {
            display: none; /* Blocked until authed */
        }

        header {
            border-bottom: 1px solid var(--border-muted);
            background-color: #020204;
            padding: 16px 40px;
        }
        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .brand-logo {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .brand-logo span { color: var(--primary); }
        
        .partner-switch-container {
            display: flex;
            gap: 4px;
            background: var(--bg-input);
            border: 1px solid var(--border-muted);
            padding: 4px;
        }
        .partner-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .partner-btn.active {
            background: var(--primary);
            color: #000000;
        }

        /* --- TAB NAVIGATION --- */
        .tabs-bar {
            border-bottom: 1px solid var(--border-muted);
            background: #07080c;
            padding: 0 40px;
        }
        .tabs-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
        }
        .nav-tab {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            padding: 16px 24px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: var(--bg-card);
        }

        /* --- MAIN HUB AREA --- */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 48px 40px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* --- CHURN & METRIC CARDS --- */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-muted);
            padding: 32px;
            position: relative;
        }
        .metric-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--border-muted);
        }
        .metric-card.accented::before { background: var(--primary); }
        
        .metric-value {
            font-size: 38px;
            font-weight: 800;
            margin: 8px 0;
            color: var(--primary);
        }
        .metric-label {
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .metric-sub {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* --- TWO COLUMN FUNCTIONAL LAYOUT --- */
        .split-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            margin-bottom: 40px;
        }
        @media (max-width: 900px) {
            .split-layout { grid-template-columns: 1fr; }
        }

            background: var(--bg-card);
            border: 1px solid var(--border-muted);
            padding: 32px;
        }
