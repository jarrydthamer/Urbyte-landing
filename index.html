  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* SCANLINES */

    #env-canvas { position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }

    /* NAV */
    nav {
      position: fixed; top:0; left:0; right:0; z-index:200;
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 52px;
      background: rgba(0,0,10,0.75);
      backdrop-filter: blur(28px);
      border-bottom: 1px solid rgba(47,120,152,0.15);

    .nav-logo { display: flex; align-items: center; gap: 12px; }

    /* HERO */
    .hero {

    /* SIGNAL — the accumulation concept, no label */
    .signal-wrap { max-width:720px; margin:64px auto 0; text-align:center; }
    .signal-orb {

    /* CHARITIES */
    .charity-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:1px; margin-top:48px; }

    /* FOUNDING */

    /* Aboriginal flag glow animation */
    @keyframes abo-glow {
      0% { filter:drop-shadow(0 0 3px rgba(255,218,0,0.2)) drop-shadow(0 0 6px rgba(204,0,0,0.2)); opacity:0.85; }
      25% { filter:drop-shadow(0 0 8px rgba(255,218,0,0.6)) drop-shadow(0 0 16px rgba(204,0,0,0.4)); opacity:1; }
      50% { filter:drop-shadow(0 0 14px rgba(255,218,0,0.9)) drop-shadow(0 0 28px rgba(204,0,0,0.6)) drop-shadow(0 0 50px rgba(255,218,0,0.3)); opacity:1; }
      75% { filter:drop-shadow(0 0 8px rgba(255,218,0,0.6)) drop-shadow(0 0 16px rgba(204,0,0,0.4)); opacity:1; }

    /* HERO LIGHT SWEEP */
    .hero-sweep-wrap { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
    .hero-sweep-text {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      font-size:clamp(80px,18vw,240px); font-weight:900; letter-spacing:-6px;
      color:transparent; white-space:nowrap; user-select:none;
      background: repeating-linear-gradient(
        45deg,
        rgba(47,120,152,0.08) 0px, rgba(47,120,152,0.08) 1px,
        transparent 1px, transparent 8px,
        rgba(102,217,238,0.04) 8px, rgba(102,217,238,0.04) 9px,
        transparent 9px, transparent 16px
      );
      -webkit-background-clip:text; background-clip:text;
      -webkit-text-stroke:1px rgba(47,120,152,0.12);
    }
    @keyframes sweep {
      0% { --sweep-x:-200%; }
      100% { --sweep-x:300%; }
    }
    .hero-sweep-text::before {
      content:attr(data-text);
      position:absolute; inset:0;
      background: repeating-linear-gradient(
        -45deg,
        rgba(43,97,122,0.05) 0px, rgba(43,97,122,0.05) 1px,
        transparent 1px, transparent 10px
      );
      -webkit-background-clip:text; background-clip:text;
      color:transparent;
    }
    .hero-sweep-text::after {
      content:attr(data-text);
      position:absolute; inset:0;
      background: linear-gradient(105deg, transparent 0%, transparent 35%, rgba(255,255,255,0.65) 48%, rgba(167,139,255,0.45) 52%, rgba(102,217,238,0.2) 56%, transparent 68%, transparent 100%);
      background-size:400% 100%;
      -webkit-background-clip:text; background-clip:text;
      color:transparent;
      animation:sweepAnim 6s ease-in-out infinite;
    }
    @keyframes sweepAnim {
      0% { background-position:200% center; }
      100% { background-position:-100% center; }
    }

    /* Flower of life logo overlay */
    .logo-fol { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:32px; height:32px; opacity:0.4; pointer-events:none; }
