(function(){
const C = document.getElementById('env-canvas');
const ctx = C.getContext('2d');
let W, H, t = 0;
const particles = [];
function resize(){ W = C.width = window.innerWidth; H = C.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);
for(let i=0; i<60; i++){
particles.push({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.2+0.2, dx:(Math.random()-0.5)*0.2, dy:(Math.random()-0.5)0.2 });
}
function draw(){
ctx.clearRect(0,0,W,H); t++;
ctx.fillStyle = 'rgba(0, 229, 204, 0.15)';
particles.forEach(p => {
ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI2); ctx.fill();
p.x += p.dx; p.y += p.dy;
if(p.x<0||p.x>W) p.dx *= -1; if(p.y<0||p.y>H) p.dy *= -1;
});
requestAnimationFrame(draw);
}
draw();
})();

async function joinTier(tier, btn){
const original = btn.textContent; btn.textContent = 'Processing...'; btn.disabled = true;
try {
const res = await fetch('base44.app', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({tier, successUrl: window.location.origin + '/?member=success', cancelUrl: window.location.href})
});
const data = await res.json();
if(data.url) window.location.href = data.url; else throw new Error();
} catch(e) {
alert('Transmission breakdown detected. Retry execution configuration sequence.');
btn.textContent = original; btn.disabled = false;
}
}

(function(){
let GB_PER_SEC = 543.768;
let START = performance.now();
let gEl = document.getElementById("gb-val");
let dEl = document.getElementById("dbu-val");
function update(ts) {
let sec = (ts - START) / 1000;
if(gEl && dEl) {
gEl.textContent = (sec * GB_PER_SEC).toFixed(1);
dEl.textContent = Math.floor(sec * GB_PER_SEC * 10).toLocaleString();
}
requestAnimationFrame(update);
}
requestAnimationFrame(update);
})();
